# AUTOGENERADO por tools/gen-pkg-workflows.sh — no editar a mano.
# Runrolling del paquete 'vulkan-tools': build individual + publicación al
# Release rodante 'packages'. Se dispara solo al cambiar su receta.
name: pkg-vulkan-tools

on:
  push:
    branches: [main]
    paths:
      - 'recipes/vulkan-tools/**'
      - '.github/workflows/pkg-vulkan-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pkg-vulkan-tools
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/pkg-build.yml
    with:
      package: vulkan-tools
