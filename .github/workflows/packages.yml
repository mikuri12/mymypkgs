name: packages

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'tools/**'
      - 'ROOTFS_TAG'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

# PLAN Fase 2: compilar DENTRO del chroot del rootfs de ROOTFS_TAG
# (descargado de mylfs Releases). Publicar al Release rodante 'packages'.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LFS: /mnt/lfs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del disco
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Descargar rootfs de mylfs (ROOTFS_TAG)
        run: |
          TAG=$(head -1 ROOTFS_TAG)
          echo "ROOTFS_TAG=$TAG"
          mkdir -p incoming
          # el release va partido (2GB por asset): bajar partes y reconstruir
          gh release download "$TAG" -R mikuri12/mylfs -D incoming \
            --pattern 'rootfs-base.tar.zst.part*' --pattern '*.sha256'
          cat incoming/rootfs-base.tar.zst.part* > incoming/rootfs-base.tar.zst
          grep 'rootfs-base.tar.zst$' incoming/rootfs-base.tar.zst.sha256 | ( cd incoming && sha256sum -c - )
          rm -f incoming/rootfs-base.tar.zst.part*
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restaurar chroot del rootfs
        run: |
          sudo mkdir -p /mnt/lfs
          sudo tar --zstd -xpf incoming/rootfs-base.tar.zst -C /mnt --numeric-owner --keep-directory-symlink
          rm -f incoming/rootfs-base.tar.zst
          df -h /mnt

      - name: Descargar fuentes de las recetas (sha256 verificados)
        run: |
          sudo mkdir -p /mnt/lfs/sources
          # FUENTE por receta con NOMBRE ÚNICO: tags genéricos colisionan
          # (greetd 0.10.3.tar.gz vs otros) → prefijo <paquete>__<archivo>.
          # retry POR ARCHIVO (lección: reset de red a mitad de lote).
          for r in recipes/*/; do
            pkg=$(basename "$r")
            srcs=$(awk '/^sources *=/{f=1} f{print} f && /\]/{exit}' "$r/recipe.toml" | grep -oE 'https?://[^", ]+')
            wants=$(awk '/^checksums *=/{f=1} f{print} f && /\]/{exit}' "$r/recipe.toml" | grep -oE '[0-9a-f]{64}')
            sidx=0
            for src in $srcs; do
              sidx=$((sidx+1))
              want=$(printf '%s\n' $wants | sed -n "${sidx}p")
              f="${pkg}__$(basename "$src")"
              if [ ! -f "/mnt/lfs/sources/$f" ]; then
                ok=0
                for i in 1 2 3 4 5; do
                  sudo curl -fsSL --retry 3 -o "/mnt/lfs/sources/$f" "$src" && { ok=1; break; }
                  echo "retry $f (intento $i)"; sleep 10
                done
                [ $ok -eq 1 ] || { echo "descarga falló: $src"; exit 1; }
              fi
              got=$(sudo sha256sum "/mnt/lfs/sources/$f" | cut -d' ' -f1)
              [ "$got" = "$want" ] || { echo "SHA256 BAD para $f (want $want)"; exit 1; }
              echo "fuente OK: $f"
            done
          done

      - name: Montar vfs y construir paquetes dentro del chroot
        run: |
          set -e
          sudo mkdir -p /mnt/lfs/{dev,proc,sys,run,dev/pts,dev/shm} /mnt/lfs/staging /mnt/lfs/packages
          sudo mount --bind /dev /mnt/lfs/dev
          sudo mount -vt devpts devpts -o gid=5,mode=0620 /mnt/lfs/dev/pts
          sudo mount -vt proc proc /mnt/lfs/proc
          sudo mount -vt sysfs sysfs /mnt/lfs/sys
          sudo mount -vt tmpfs tmpfs /mnt/lfs/run
          sudo mount -vt tmpfs -o nosuid,nodev tmpfs /mnt/lfs/dev/shm

          # cmake 4.1.0 (BLFS 12.4, md5 verificado): build-dep del chroot
          # — dbus lo necesita; la base LFS solo trae meson/ninja.
          # (script por archivo: heredoc indentado rompe el YAML del workflow)
          sudo curl -fsSL --retry 3 -o /mnt/lfs/sources/cmake-4.1.0.tar.gz \
            "https://cmake.org/files/v4.1/cmake-4.1.0.tar.gz"
          echo "80ae27faba5068c8ec12c77bf00e6db3  /mnt/lfs/sources/cmake-4.1.0.tar.gz" | \
            sudo tee /mnt/lfs/sources/cmake.md5 >/dev/null
          sudo bash -c 'cd /mnt/lfs/sources && md5sum -c cmake.md5'
          cat > /tmp/build-cmake.sh << 'CMEOF'
          set -euo pipefail
          cd /sources
          rm -rf cmake-4.1.0
          tar -xpf cmake-4.1.0.tar.gz && cd cmake-4.1.0
          sed -i '/"lib64"/s/64//' Modules/GNUInstallDirs.cmake
          ./bootstrap --prefix=/usr --parallel=$(nproc) \
            -- -DCMAKE_USE_OPENSSL=ON -DBUILD_TESTING=OFF
          make -j"$(nproc)"
          make install
          cd /sources && rm -rf cmake-4.1.0
          CMEOF
          sudo cp /tmp/build-cmake.sh /mnt/lfs/sources/build-cmake.sh
          sudo chroot /mnt/lfs /usr/bin/env -i HOME=/root TERM="$TERM" \
            PATH=/usr/bin:/usr/sbin LC_ALL=POSIX \
            bash -e /sources/build-cmake.sh
          sudo test -x /mnt/lfs/usr/bin/cmake || { echo "cmake no instalado"; exit 1; }
          echo "cmake OK en el chroot"

          # Rust toolchain PREBUILT (PLAN: solo para compilar, no al paquete):
          # greetd/Halley/Noctalia-greeter lo usan. Instalada en /opt/rust
          # dentro del chroot, NO va a ningún paquete.
          sudo curl -fsSL --retry 3 -o /mnt/lfs/sources/rust.tar.gz \
            "https://static.rust-lang.org/dist/rust-1.99.1-x86_64-unknown-linux-gnu.tar.gz" \
            || { echo "descarga rust falló"; exit 1; }
          cat > /tmp/install-rust.sh << 'RSEOF'
          set -euo pipefail
          cd /sources
          rm -rf rust-1.99.1-x86_64-unknown-linux-gnu
          tar -xpf rust.tar.gz
          cd rust-1.99.1-x86_64-unknown-linux-gnu
          # sin docs ni rust-docs (PLAN: sin bloat)
          ./install.sh --prefix=/opt/rust --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu
          cd /sources && rm -rf rust-1.99.1-x86_64-unknown-linux-gnu
          RSEOF
          sudo cp /tmp/install-rust.sh /mnt/lfs/sources/install-rust.sh
          sudo chroot /mnt/lfs /usr/bin/env -i HOME=/root TERM="$TERM" \
            PATH=/usr/bin:/usr/sbin LC_ALL=POSIX \
            bash -e /sources/install-rust.sh
          sudo test -x /mnt/lfs/opt/rust/bin/cargo || { echo "cargo no instalado"; exit 1; }
          echo "rust 1.99.1 OK en el chroot (/opt/rust)"

          # Copiar recetas+tools al chroot (scripts del repo corren dentro)
          sudo cp -r recipes /mnt/lfs/
          sudo cp -r tools /mnt/lfs/

          # Orden por CAPAS (PLAN: matriz por dependencias) — el alfabético
          # compilaba foot antes que wayland, que foot necesita para linkear.
          ORDER="libdrm wayland wayland-protocols libxkbcommon libevdev mtdev libinput dbus alsa-lib alsa-ucm-conf seatd turnstile greetd pipewire wireplumber wl-clipboard slurp grim foot fuzzel"
          # recetas no listadas: al final
          EXTRA=""
          for d in /mnt/lfs/recipes/*/; do
            n=$(basename "$d"); case " $ORDER " in *" $n "*) ;; *) EXTRA="$EXTRA $n";; esac
          done
          for pkgname in $ORDER $EXTRA; do
            [ -d "/mnt/lfs/recipes/$pkgname" ] || continue
            sudo chroot /mnt/lfs /usr/bin/env -i \
              HOME=/root TERM="$TERM" PATH=/opt/rust/bin:/usr/bin:/usr/sbin \
              MAKEFLAGS="-j$(nproc)" LC_ALL=POSIX \
              CFLAGS="-march=skylake -mtune=skylake -O2 -pipe -fno-plt" \
              CXXFLAGS="-march=skylake -mtune=skylake -O2 -pipe -fno-plt" \
              LDFLAGS="-Wl,-O1,--as-needed,--sort-common" \
              XORG_PREFIX=/usr \
              bash /tools/build-pkg.sh "/recipes/$pkgname" /sources /packages
          done

          sudo umount /mnt/lfs/dev/pts /mnt/lfs/dev/shm /mnt/lfs/sys /mnt/lfs/proc /mnt/lfs/run /mnt/lfs/dev
          ls -la /mnt/lfs/packages/

      - name: Generar index.toml y firmarlo
        run: |
          # el index se genera DESDE FUERA con los paquetes ya en el host
          sudo bash /mnt/lfs/tools/make-index.sh /mnt/lfs/packages > index.toml
          sudo cp -r /mnt/lfs/packages .
          sudo chown -R runner:runner packages index.toml
          cat index.toml
          # firmar (si el secret está presente)
          if [ -n "${{ secrets.MYMY_SIGNING_KEY }}" ]; then
            printf '%s' "${{ secrets.MYMY_SIGNING_KEY }}" > /tmp/mymy-key
            chmod 600 /tmp/mymy-key
            ssh-keygen -Y sign -f /tmp/mymy-key -n mymy index.toml
            rm -f /tmp/mymy-key
            ls index.toml.sig
          else
            echo "::warning::secret MYMY_SIGNING_KEY no configurado; index sin firmar"
          fi

      - name: Publicar al Release rodante 'packages' (índice AL FINAL)
        run: |
          # crear el release rodante si no existe
          gh release view packages -R mikuri12/mymypkgs >/dev/null 2>&1 || \
            gh release create packages -R mikuri12/mymypkgs \
              --title "packages" --notes "Release rodante: paquetes mymypkgs. El index.toml se sube SIEMPRE al final."
          # PRIMERO los paquetes
          gh release upload packages -R mikuri12/mymypkgs --clobber \
            packages/*.tar.zst packages/*.sha256
          # AL FINAL el índice (con o sin firma)
          if [ -f index.toml.sig ]; then
            gh release upload packages -R mikuri12/mymypkgs --clobber index.toml index.toml.sig
          else
            gh release upload packages -R mikuri12/mymypkgs --clobber index.toml
          fi
        env:
          GH_TOKEN: ${{ github.token }}
